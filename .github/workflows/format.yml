name: Format

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
    tags: '*'

jobs:
  format:
    name: Format suggestions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      uses: julia-actions/julia-format@v4
      with:
        version: '1'
        paths: 'src/, test/'
