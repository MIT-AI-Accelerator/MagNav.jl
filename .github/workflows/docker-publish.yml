name: Docker

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by separate
# terms of service, privacy policy, and support documentation.
# Based on: https://github.com/actions/starter-workflows/blob/main/ci/docker-publish.yml

on:
  schedule:
    - cron: 30 11 * * *
  push:
    branches:
      - master
    tags: '*'

env:
  REGISTRY: ghcr.io # if empty, uses docker.io for Docker Hub
  IMAGE_NAME: ${{ github.repository }} # <account>/<repo>

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge with sigstore/fulcio
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into Docker registry ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # This will only write to the public Rekor transparency log when the Docker
      # repository is public to avoid leaking data.
      - name: Sign the published Docker image digest
        env:
          tags: ${{ steps.meta.outputs.tags }}
          digest: ${{ steps.build-and-push.outputs.digest }}
        # This step uses the identity token to provision an ephemeral certificate
        # against the sigstore community Fulcio instance.
        run: echo "${tags}" | xargs -I {} cosign sign --yes {}@${digest}
